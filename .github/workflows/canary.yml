name: Canary

# Runs scripts/gates.sh, CI's MoonBit gates, on the latest and nightly
# toolchains. The packages are the native build dependencies CI installs.

on:
  schedule:
    # 07:07 JST, after gaato/moonbit-docker rebuilds the latest and nightly images.
    - cron: "07 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: gaato/.github/.github/workflows/moonbit-canary.yml@main
    with:
      gates: scripts/gates.sh
      setup: apt-get update && apt-get install -y --no-install-recommends build-essential libssl-dev zlib1g-dev
