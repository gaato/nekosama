[project]
name = "nekosama"
version = "1.0.0"
description = "Discord bot for Okayun birthday projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4",
    "openai>=1.91.0",
]

[project.scripts]
nekosama = "nekosama.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nekosama"]
