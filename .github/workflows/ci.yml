name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MOONBIT_VERSION: 0.10.17+d971670cd

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libssl-dev zlib1g-dev

      - name: Install MoonBit
        run: |
          curl --fail --silent --show-error --location \
            https://cli.moonbitlang.com/install/unix.sh \
            --output /tmp/moonbit-install.sh
          bash /tmp/moonbit-install.sh "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit package registry
        run: moon update

      # The canary (canary.yml) runs the same script on newer toolchains.
      - name: Check, test, and check formatting
        run: scripts/gates.sh
